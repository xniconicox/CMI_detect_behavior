data_dir: "data"
cache_dir: "cache"
output_dir: "output/experiments"
use_windows: false
experiment_name: preprocess_v51_anomaly

# preprocessing hyperparameters (no window mode)
preprocessing:
  # window関連の設定はno window modeでは不要
  # window_size: 128
  # stride: 64
  min_sequence_length: 20
  padding_value: -1.0  # ToFデータのパディング値と統一
  sampling_rate: 50.0
  # メモリ効率化のための設定
  n_jobs: 1  # 並列処理を無効化
  chunk_size: 500  # チャンクサイズ（500に削減）
  max_sequence_length_limit: 1500  # 最大シーケンス長制限（2000から削減）
  fft_bands:
    - [0.5, 2]
    - [2, 5]
    - [5, 10]
    - [10, 20]
  wavelet: "db4"
  wavelet_level: 2
  tda_dimension: 1
  tda_bins: 8
  tda_sigma: 0.1
  # 各特徴量計算の有無を制御
  use_wavelet_features: true
  use_tda_features: true
  use_tof_event_features: false
  use_temperature_gradient_features: true
  tof_depth: 5
  tof_height: 8
  tof_width: 8
  use_world_acc: true
  use_handedness_augmentation: true


sensor_acc_cols:
  - acc_x
  - acc_y
  - acc_z

sensor_rot_cols:
  - rot_w
  - rot_x
  - rot_y
  - rot_z

sensor_thm_cols:
  - thm_1
  - thm_2
  - thm_3
  - thm_4
  - thm_5

sensor_tof_cols:
  - tof_1_v0
# ToFセンサー（5層×64ピクセル）
# 例: tof_1_v0〜tof_5_v63
# 下記はPythonで自動展開することを推奨
# 例: [f"tof_{d}_v{i}" for d in range(1,6) for i in range(64)]

demographics_cols:
  - adult_child
  - age
  - sex
  - handedness
  - height_cm
  - shoulder_to_wrist_cm
  - elbow_to_wrist_cm
# 追加のdemographics項目は現状なし
# 必要に応じて追記する

training_params:
  epochs: 50
  batch_size: 32
